# Duplicate eval rules for microsoft/vscode, fixed before scoring (0.1.2).
# No [components]: triage on vscode is not evaluated, only dedupe.
#
# Window: queries created 2023-2024. Earlier would work too; later is out
# because maintainer accounts post LLM-written triage comments from 2025 on,
# and labels made by an LLM would make an LLM eval circular. Fetched pool:
# from 2022-01-01, so early queries have a year of history to match.
# Measured at freeze: 480 of 2310 otherwise usable pairs (21%) name a target
# from before 2022 and are dropped as unusable, so long-lived issues (old
# feature requests that keep attracting duplicates) are under-represented.
# Pairs whose target is newer than the query (378, maintainers closing the
# older issue in favour of a busier one) are dropped too: at triage time the
# target didn't exist.
#
# Positive: the `*duplicate` label (set by a maintainer, the bot's close
# comment names no target) plus one human comment naming the target
# (`/duplicate #N`, "duplicate of <url>").
# Negative: closed as completed by a merged pull request or a commit.

[dedupe]
window = ["2023-01-01", "2024-12-31"]
duplicate_label = "*duplicate"
negatives = "closed_by_change"
sample = 200

# Missing-info eval rules (0.1.3), fixed before scoring. Positive: the
# maintainers labelled the report `info-needed`. Negative: a `bug` closed as
# completed by a merged PR or a commit that never carried `info-needed`
# (label history checked on GitHub), so someone could act on it as written.
# Both sides: filed through the issue reporter template (user reports, not
# team notes) and with an unedited body (the text the maintainer saw).
# Dev split 2023-2024 (methods compared, errors read); test split 2022,
# scored once with the chosen method.
[readiness]
window = ["2023-01-01", "2024-12-31"]
test_window = ["2022-01-01", "2022-12-31"]
template = "Does this issue occur when all extensions are disabled"
needs_info_label = "info-needed"
bug_label = "bug"
sample = 200

# Repo map (0.2): path patterns, first match wins; the last segment of a
# pattern names the component (`contrib/*` -> `.../contrib/terminal`).
# Everything else falls back to its top-level folder (build, test, cli).
[map]
patterns = [
  "src/vs/workbench/contrib/*",
  "src/vs/workbench/services/*",
  "src/vs/workbench/api",
  "src/vs/workbench/*",
  "src/vs/editor/contrib/*",
  "src/vs/editor/*",
  "src/vs/platform/*",
  "src/vs/base/*",
  "src/vs/*",
  "extensions/*",
]

# Impact eval (0.2), fixed before scoring: issues closed as completed by a
# PR or a commit, whose fix commits ("fixes #N") touch 1 to 50 files; the
# truth is the components those commits touched. Map cut before the dev
# window, so co-change never contains a fix being predicted.
[impact]
map_until = 2022-12-31
window = ["2023-01-01", "2023-12-31"]
test_window = ["2024-01-01", "2024-12-31"]
sample = 300
