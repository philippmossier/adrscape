# Components of the target repo, for triage: name = what belongs to it.
# The triage card's `component` must be one of these names (or null).
# Descriptions are part of the prompt. The v2 repo map derives this list
# from paths and manifests; until then it is written by hand.

[components]
hardware-check = "GPU, memory and storage detection in the browser, the GPU bandwidth benchmark, the machine tier, the model recommendation and the speed advice after the first answer (src/lib/hardware)."
models = "The model catalog, the model picker, downloading model weights from Hugging Face, the model cache, loading progress and switching models (src/lib/models, model-picker, loading)."
inference = "Running the model: the Web Worker with Transformers.js, WebGPU and WebAssembly backends, token streaming, generation speed, load errors from the runtime (src/lib/engine)."
chat = "Conversations: sending and streaming messages, the composer, message rendering, the chat sidebar and chat history in localStorage (src/lib/chat, chat components)."
privacy = "The network request counter and privacy panel, the Content-Security-Policy, delete everything, the compliance page (src/lib/privacy, docs/for-it-and-compliance.md)."
ui = "Layout, theme, German and English texts, language detection, accessibility, shadcn components (src/components/ui, lang, labels, theme)."
build-deploy = "Vite build, the copied WebAssembly runtime, response headers, Cloudflare deploy, CI and dependencies (vite.config.ts, scripts, wrangler, .github)."

# Repo map (0.2): the same components as file globs, checked in order; files
# that match none fall back to their top-level folder.
[map.named]
hardware-check = ["src/lib/hardware/**", "src/components/advice-banner.tsx"]
models = ["src/lib/models/**", "src/components/model-picker.tsx", "src/components/loading.tsx"]
inference = ["src/lib/engine/**"]
chat = ["src/lib/chat/**", "src/components/chat*.tsx", "src/components/message.tsx", "src/components/welcome.tsx"]
privacy = ["src/lib/privacy/**", "src/components/privacy-panel.tsx", "docs/for-it-and-compliance.md"]
ui = ["src/components/ui/**", "src/components/app-header.tsx", "src/components/sidebar-chrome.tsx", "src/components/theme-menu.tsx", "src/hooks/**", "src/lib/lang*.ts", "src/lib/labels.ts", "src/lib/theme.ts", "src/styles.css"]
build-deploy = ["vite.config.ts", "vitest.config.ts", "wrangler.jsonc", "scripts/**", ".github/**", "package.json", "package-lock.json", "tsconfig*.json"]

# Core loop (0.2): how a worktree is set up and what has to pass. Commands
# run in the container below, never on the host; only `install` has
# network, before the agent changes anything (see src/cofabriq/loop/sandbox.py).
[loop]
image = "docker.io/library/node:24-slim"
setup = "corepack enable"
install = "pnpm install --frozen-lockfile"
repro_dir = "src/repro"
repro = "pnpm exec vitest run"
# the reproducer writes only these; its test must pass types and lint
tests = ["src/**/*.test.ts"]
repro_checks = ["types", "lint"]
protected = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tsconfig.json", "vitest.config.ts", "eslint.config.js", "playwright.config.ts"]
checks = [
  { name = "types", cmd = "pnpm check-types" },
  { name = "lint", cmd = "pnpm lint" },
  { name = "test", cmd = "pnpm test" },
]

# Risk tier of a change (0.2): the highest tier of the components its
# non-test files are in (via [map]); test files count as low, a component
# in no list gets `unlisted` (see src/cofabriq/loop/pr.py).
[risk]
high = ["privacy", "build-deploy"]  # the local-only promise; CI, deps, headers
medium = ["inference", "models", "hardware-check"]  # needs a GPU or a download to see
low = ["chat", "ui"]
unlisted = "medium"
