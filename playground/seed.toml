[[issue]]
key = "dependabot-setup"
title = "Add Dependabot for npm and GitHub Actions"
type = "chore"
component = "build-deploy"
body = """
Nothing tells us when `@huggingface/transformers`, Vite or the actions in `ci.yml` have updates. A `.github/dependabot.yml` with weekly npm and github-actions updates would keep them current. Note that a transformers.js update may also need `scripts/copy-ort.mjs` to copy a new WebAssembly runtime.
"""

