# Planted bugs in github.com/philippmossier/local-ai-chat-playground: the
# answer key for refine and the core loop (0.2).
#
# Each bug was planted in the playground's code on purpose, so the truth is
# known by construction and no model has seen the fix in training. The issue
# a user would file is the entry with the same `key` in seed.toml.
#
#   kind    logic (repro in vitest) | ui (repro in Playwright, fake engine)
#   size    S one line | M a few lines or two places | L a rewrite with a design call
#   files   the files the fix changes (truth for refine's hit@k)
#   repro   bugs/repro/<file>: red on the planted code, green with the fix.
#           A vitest file goes to src/repro/, a Playwright spec to e2e/repro/.
#   fix     bugs/fixes/<key>.patch: the reference fix (code only), applies
#           to the planted code with `git apply`
#
# Each bug is isolated: its repro turns green when only its own fix is
# applied. Where an existing test of the playground guarded a bug, that test
# case was removed with the plant (a coverage gap, as in a real repo).

[[bug]]
key = "title-ellipsis"
kind = "logic"
size = "S"
files = ["src/lib/chat/store.ts"]
repro = "title-ellipsis.test.ts"

